name: Deploy Cardify Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cardify-backend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install '.[dev]'
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  deploy:
    needs: test
    if: ${{ vars.CARDIFY_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      CARDIFY_APP_DIR: ${{ vars.CARDIFY_APP_DIR || '/opt/cardify' }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "${SERVER_HOST}"
          test -n "${SERVER_USER}"
          test -n "${SSH_PRIVATE_KEY}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 30 -H "${SERVER_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Sync backend and deployment files
        run: |
          SSH_OPTS="-i ~/.ssh/id_ed25519 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          ssh ${SSH_OPTS} "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${CARDIFY_APP_DIR}/backend' '${CARDIFY_APP_DIR}/deploy' '${CARDIFY_APP_DIR}/storage'"
          rsync -az --delete -e "ssh ${SSH_OPTS}" \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='storage/' \
            backend/ "${SERVER_USER}@${SERVER_HOST}:${CARDIFY_APP_DIR}/backend/"
          rsync -az --delete -e "ssh ${SSH_OPTS}" deploy/ "${SERVER_USER}@${SERVER_HOST}:${CARDIFY_APP_DIR}/deploy/"
      - name: Deploy and verify health
        run: |
          SSH_OPTS="-i ~/.ssh/id_ed25519 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          ssh ${SSH_OPTS} "${SERVER_USER}@${SERVER_HOST}" "CARDIFY_APP_DIR='${CARDIFY_APP_DIR}' bash '${CARDIFY_APP_DIR}/deploy/backend-deploy.sh'"
      - name: Record deployed revision
        run: |
          SSH_OPTS="-i ~/.ssh/id_ed25519 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          ssh ${SSH_OPTS} "${SERVER_USER}@${SERVER_HOST}" "printf '%s\n' '${GITHUB_SHA}' > '${CARDIFY_APP_DIR}/deploy/last_deployed_sha'"
