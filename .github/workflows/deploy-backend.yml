name: Deploy Cardify Backend

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Deploy even when this commit is already active
        required: false
        default: false
        type: boolean

concurrency:
  group: cardify-production-deploy
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install '.[dev]'
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  deploy:
    needs: test
    if: ${{ needs.test.result == 'success' && vars.CARDIFY_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, cardify-production]
    environment: production
    steps:
      - name: Verify production ref
        run: test "${GITHUB_REF}" = 'refs/heads/main'
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Check deployed revision
        id: deployment-gate
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy || 'false' }}
        run: |
          deployed_sha="$(cat /opt/cardify/deploy/last_deployed_sha 2>/dev/null || true)"
          if [[ "${GITHUB_SHA}" == "${deployed_sha}" && "${FORCE_DEPLOY}" != 'true' ]]; then
            echo 'should_deploy=false' >> "${GITHUB_OUTPUT}"
            echo "${GITHUB_SHA} is already active."
          else
            echo 'should_deploy=true' >> "${GITHUB_OUTPUT}"
          fi
      - name: Deploy backend
        if: steps.deployment-gate.outputs.should_deploy == 'true'
        run: sudo /usr/local/sbin/cardify-deploy "${GITHUB_WORKSPACE}" "${GITHUB_SHA}"
