name: Deploy Cardify Backend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Deploy even when this commit is already active
        required: false
        default: false
        type: boolean
      engine:
        description: 发布执行位置
        type: choice
        options: [server, github]
        default: server

concurrency:
  group: cardify-production-deploy
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

env:
  DEPLOY_ENGINE: ${{ (github.event_name == 'workflow_dispatch' && inputs.engine) || vars.DEPLOY_ENGINE || 'server' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install '.[dev]'
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  deploy-server:
    name: 东京自托管发布
    needs: test
    if: ${{ needs.test.result == 'success' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.engine) || vars.DEPLOY_ENGINE || 'server') == 'server' }}
    runs-on: [self-hosted, cardify-production]
    environment: production
    steps:
      - name: Verify production ref
        run: test "${GITHUB_REF}" = 'refs/heads/main'
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Check deployed revision
        id: deployment-gate
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy || 'false' }}
        run: |
          deployed_sha="$(cat /opt/cardify/deploy/last_deployed_sha 2>/dev/null || true)"
          if [[ "${GITHUB_SHA}" == "${deployed_sha}" && "${FORCE_DEPLOY}" != 'true' ]]; then
            echo 'should_deploy=false' >> "${GITHUB_OUTPUT}"
            echo "${GITHUB_SHA} is already active."
          else
            echo 'should_deploy=true' >> "${GITHUB_OUTPUT}"
          fi
      - name: Deploy backend
        if: steps.deployment-gate.outputs.should_deploy == 'true'
        run: sudo /usr/local/sbin/cardify-deploy "${GITHUB_WORKSPACE}" "${GITHUB_SHA}"

  deploy-github:
    name: GitHub 托管触发发布
    needs: test
    if: ${{ needs.test.result == 'success' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.engine) || vars.DEPLOY_ENGINE || 'server') == 'github' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure hosted deploy SSH
        env:
          SSH_KEY: ${{ secrets.CARDIFY_HOSTED_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CARDIFY_HOSTED_KNOWN_HOSTS }}
          HOST: ${{ secrets.CARDIFY_HOSTED_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/cardify_hosted
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/cardify_known_hosts
          chmod 600 ~/.ssh/cardify_hosted ~/.ssh/cardify_known_hosts
      - name: Trigger trusted deploy
        env:
          HOST: ${{ secrets.CARDIFY_HOSTED_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cardify_hosted \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/cardify_known_hosts \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            "root@${HOST}" "$GITHUB_SHA"
      - name: Verify public health
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 https://cardify.notenap.com/health >/dev/null
